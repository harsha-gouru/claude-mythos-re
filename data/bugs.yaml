mythos_disclosure_dashboard_revealed_2026_05_20:
  # 26 findings whose disclosure window closed and were published on red.anthropic.com/2026/cvd/.
  # Patch filenames assigned but may be MISSING until the patch-fetch agent completes — see patches/README.md once it lands.

  # nginx — CVE-2026-27654 split into 2 distinct upstream commits
  - id: nginx-cve-2026-27654-webdav-copy-move
    project: nginx
    cve: CVE-2026-27654
    ant_id: ANT-2026-HY56VRSB
    severity: high
    bug_class: heap-buffer-overflow
    summary: WebDAV DAV COPY/MOVE heap buffer overflow with alias directive.
    patch: patches/nginx-2026-27654-webdav-copy-move-path-validation.patch
    upstream: https://github.com/nginx/nginx/commit/f0a084645b8fede56ee08f2cc557c2475eb2a28d
    fix_invariant: DAV COPY/MOVE handler validates source+destination resolve to paths under configured root

  - id: nginx-cve-2026-27654-webdav-alias-arbitrary-write
    project: nginx
    cve: CVE-2026-27654
    ant_id: ANT-2026-VS18SA90
    severity: critical
    bug_class: arbitrary-file-write
    summary: Unauthenticated remote file write in nginx WebDAV module via alias-prefix size_t underflow.
    patch: patches/nginx-2026-27654-webdav-alias-destination-length.patch
    upstream: https://github.com/nginx/nginx/commit/9739e755b8dddba82e65ca2a08d079f4c9826b75
    fix_invariant: destination URI length check when `alias` directive is in effect prevents prefix underflow

  # jq
  - id: jq-cve-2026-32316-string-concat
    project: jq
    cve: CVE-2026-32316
    ant_id: ANT-2026-EBDTPNVH
