    upstream: https://github.com/jqlang/jq/commit/e47e56d226519635768e6aab2f38f0ab037c09e5
    fix_invariant: jvp_string_append / jvp_string_copy_replace_bad check (currlen+len)*2 against UINT32_MAX before alloc

